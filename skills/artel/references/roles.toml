# Artel default role matrix, schema 2 (core §8). Resolved by scripts/matrix.py — never chosen from memory.
#
# A candidate is "<family>.<class>@<effort>"; classes map to concrete model ids in the user's
# ~/.artel/artel.toml ([[providers]].models). Each role has an ordered chain per tier group (t01 = T0–T1,
# t23 = T2–T3). `matrix.py pick` walks the chain and takes the first candidate that is:
#   - in a family the user has, and whose family is not over the limit threshold (Orca rateLimits);
#   - not banned for the role;
#   - for review roles (review = true): never the author's own model; a family other than the author's
#     is preferred, then another model of the same family ("independence weakened", core §2.2),
#     then a reserve family other than the author's. Reserve families are always tried last.
# The user's [roles] table in ~/.artel/artel.toml replaces a role's chain (calibration, core §12).

schema = 2

[policy]
# % of a family's usage window at or above which no NEW work starts for that family (owner decision D2,
# 2026-10-06). A window at 100% always means "exhausted" — work in flight is handed over.
new_work_threshold = 90
reserve_families = ["deepseek"]

[roles.coordinator]
t01 = ["anthropic.flagship@medium", "openai.mid@high"]
t23 = ["anthropic.flagship@high", "openai.mid@high"]

[roles.spec_writer]
t01 = ["anthropic.top@high", "anthropic.flagship@high", "openai.mid@high"]
t23 = ["anthropic.top@high", "anthropic.flagship@high", "openai.mid@high"]

[roles.spec_validator_adequacy]
review = true
banned = ["openai.cheap"]
t01 = ["anthropic.flagship@high", "openai.mid@xhigh", "anthropic.mid@high", "deepseek.mid@high"]
t23 = ["anthropic.flagship@high", "openai.mid@xhigh", "anthropic.mid@high", "deepseek.mid@high"]

